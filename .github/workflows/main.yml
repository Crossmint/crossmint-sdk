name: CI

env:
    NEXT_PUBLIC_CROSSMINT_API_KEY: ${{ secrets.NEXT_PUBLIC_CROSSMINT_AUTH_SMART_WALLET_API_KEY }}
    PREVIEW_CK_KEY: ${{ secrets.PREVIEW_CK_KEY }}
    PREVIEW_SK_KEY: ${{ secrets.PREVIEW_SK_KEY }}
    TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    TURBO_TEAM: ${{ vars.TURBO_TEAM }}

on:
    push:
        branches:
            - main
            - beta
    workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
    build-and-test:
        name: Build & Test
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Node.js, PNPM, and install dependencies
              uses: ./.github/actions/pnpm-install
              with:
                  chainguard-identity: ${{ vars.CHAINGUARD_IDENTITY }}

            - name: Build all
              run: pnpm build

            - name: Test all
              run: pnpm test:vitest

    release:
        name: Release
        runs-on: ubuntu-latest
        needs: [build-and-test]
        permissions:
            actions: write
            contents: write
            pull-requests: write
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Node.js, PNPM, and install dependencies
              uses: ./.github/actions/pnpm-install
              with:
                  chainguard-identity: ${{ vars.CHAINGUARD_IDENTITY }}

            - name: Setup Node.js 24 for OIDC trusted publishing
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: "24"
                  registry-url: "https://registry.npmjs.org"

            - name: Update npm for OIDC trusted publishing
              run: npm install -g npm@11.6.2

            - name: Create Release Pull Request or Publish
              id: changesets
              uses: changesets/action@e0145edc7d9d8679003495b11f87bd8ef63c0cba # v1.5.3
              with:
                  commit: ${{ github.ref_name == 'beta' && 'Release beta packages' || 'Release packages' }}
                  title: ${{ github.ref_name == 'beta' && 'Release beta packages' || 'Release packages' }}
                  publish: pnpm change:publish
                  version: pnpm change:version
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # @crossmint:registry in .npmrc already sends `pnpm publish` to npmjs.org; this
                  # keeps it there even for a package outside that scope.
                  NPM_CONFIG_REGISTRY: https://registry.npmjs.org

            # The action pushes the release branch with GITHUB_TOKEN, which starts no `push`
            # run, so the checks `main` requires would never report on the release pull request.
            - name: Run CI on the release pull request
              if: steps.changesets.outputs.pullRequestNumber != ''
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh workflow run ci.yml --ref "changeset-release/${GITHUB_REF_NAME}"
