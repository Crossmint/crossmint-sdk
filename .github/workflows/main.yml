name: CI

env:
    NEXT_PUBLIC_CROSSMINT_API_KEY: ${{ secrets.NEXT_PUBLIC_CROSSMINT_AUTH_SMART_WALLET_API_KEY }}
    PREVIEW_CK_KEY: ${{ secrets.PREVIEW_CK_KEY }}
    PREVIEW_SK_KEY: ${{ secrets.PREVIEW_SK_KEY }}
    TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    TURBO_TEAM: ${{ vars.TURBO_TEAM }}

on:
    push:
        branches:
            - main
            - beta
    workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
    build-and-test:
        name: Build & Test
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Node.js, PNPM, and install dependencies
              uses: ./.github/actions/pnpm-install

            - name: Build all
              run: pnpm build

            - name: Test all
              run: pnpm test:vitest

    release:
        name: Release
        runs-on: ubuntu-latest
        needs: [build-and-test]
        permissions:
            contents: write
            pull-requests: write
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Node.js, PNPM, and install dependencies
              uses: ./.github/actions/pnpm-install

            - name: Setup Node.js 24 for OIDC trusted publishing
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: "24"
                  registry-url: "https://registry.npmjs.org"

            - name: Update npm for OIDC trusted publishing
              run: npm install -g npm@11.6.2

            - name: Create Release Pull Request or Publish
              uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
              with:
                  commit: ${{ github.ref_name == 'beta' && 'Release beta packages' || 'Release packages' }}
                  title: ${{ github.ref_name == 'beta' && 'Release beta packages' || 'Release packages' }}
                  publish: pnpm change:publish
                  version: pnpm change:version
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
